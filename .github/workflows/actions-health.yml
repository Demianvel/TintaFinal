name: GitHub Actions health check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-health.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escribir comprobación
        run: |
          printf '# GitHub Actions activo\n\n- Fecha UTC: %s\n- Commit: %s\n' "$(date -u +'%Y-%m-%d %H:%M:%S')" "$GITHUB_SHA" > ACTIONS_HEALTH.md
      - name: Guardar comprobación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACTIONS_HEALTH.md
          git commit -m "Confirmar GitHub Actions activo"
          git push
