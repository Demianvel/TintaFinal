name: Deploy TintaFinal to Roblox

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "default.project.json"
      - ".github/workflows/publish-roblox.yml"
  workflow_dispatch:

concurrency:
  group: tintafinal-production
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

env:
  ROBLOX_UNIVERSE_ID: "8973271699"
  ROBLOX_PLACE_ID: "73618099851560"
  ROJO_VERSION: "7.6.1"

jobs:
  deploy:
    name: Validar, compilar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        id: checkout
        uses: actions/checkout@v4

      - name: Marcar despliegue en curso
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/pending.json
          import json
          print(json.dumps({
              "state": "pending",
              "context": "tintafinal/roblox-deploy",
              "description": "Validando y compilando TintaFinal",
          }))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/pending.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null

      - name: Comprobar secreto de Roblox
        id: secret
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ROBLOX_API_KEY:-}" ]; then
            echo "Falta el secreto ROBLOX_API_KEY."
            exit 1
          fi

      - name: Validar estructura del proyecto
        id: structure
        shell: bash
        run: |
          set -euo pipefail
          test -f default.project.json
          test -d src/server
          test -d src/client
          test -d src/shared
          python3 -m json.tool default.project.json >/dev/null

      - name: Rechazar archivos no permitidos
        id: files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \
            \( -iname '*.exe' -o -iname '*.apk' -o -iname '*.bat' -o -iname '*.cmd' \
               -o -iname '*.msi' -o -iname '*.scr' -o -iname '*.dll' -o -iname '*.zip' \
               -o -iname '*.rar' -o -iname '*.7z' \) \
            -not -path './.git/*' -print)
          if [ -n "$forbidden" ]; then
            echo "Archivos no permitidos encontrados:"
            echo "$forbidden"
            exit 1
          fi

      - name: Buscar patrones de exploit y secretos expuestos
        id: security
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          exploit = re.compile(
              r"loadstring|game\s*:\s*HttpGet|getgenv|hookmetamethod|"
              r"getrawmetatable|sethiddenproperty|syn\.request|"
              r"firetouchinterest|queue_on_teleport|identifyexecutor|"
              r"\bKRNL\b|\bFluxus\b|\bSynapse\b|Kill Aura|Auto Win|Noclip",
              re.IGNORECASE,
          )
          api_key = re.compile(r'''ROBLOX_API_KEY\s*=\s*["'][^$"'][^"']{8,}["']''')
          excluded = {
              Path('.github/workflows/security-scan.yml'),
              Path('.github/workflows/publish-roblox.yml'),
              Path('SECURITY.md'),
          }

          findings = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in excluded:
                  continue
              try:
                  content = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if exploit.search(content):
                  findings.append(f'{path}: patrón de exploit')
              if api_key.search(content):
                  findings.append(f'{path}: posible clave expuesta')

          if findings:
              print('\n'.join(findings))
              sys.exit(1)
          print('Validación de seguridad superada.')
          PY

      - name: Instalar Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restaurar caché de Cargo
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Instalar Rojo
        id: rojo
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rojo >/dev/null 2>&1; then
            cargo install rojo --version "${ROJO_VERSION}" --locked
          fi
          rojo --version

      - name: Compilar TintaFinal.rbxlx
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          rojo build default.project.json --output build/TintaFinal.rbxlx
          test -s build/TintaFinal.rbxlx
          ls -lh build/TintaFinal.rbxlx

      - name: Guardar compilación
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: TintaFinal-Roblox-Place
          path: build/TintaFinal.rbxlx
          if-no-files-found: error
          retention-days: 14

      - name: Publicar en Roblox
        id: publish
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --request POST \
            "https://apis.roblox.com/universes/v1/${ROBLOX_UNIVERSE_ID}/places/${ROBLOX_PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary @build/TintaFinal.rbxlx \
            | tee publish-response.json

      - name: Verificar respuesta de Roblox
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path('publish-response.json').read_text(encoding='utf-8'))
          version = response.get('versionNumber')
          if not isinstance(version, int) or version < 1:
              raise SystemExit(f'Respuesta inesperada de Roblox: {response!r}')
          print(f'Roblox publicó la versión {version}.')
          PY

      - name: Guardar respuesta de publicación
        if: ${{ steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Publish-Response
          path: publish-response.json
          retention-days: 30

      - name: Publicar estado final del despliegue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_OUTCOME: ${{ steps.secret.outcome }}
          STRUCTURE_OUTCOME: ${{ steps.structure.outcome }}
          FILES_OUTCOME: ${{ steps.files.outcome }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
          ROJO_OUTCOME: ${{ steps.rojo.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${VERIFY_OUTCOME}" = "success" ]; then
            state="success"
            description="TintaFinal publicada correctamente en Roblox"
          else
            state="failure"
            description="Falló el despliegue; revisar el workflow"
          fi

          python3 - "$state" "$description" <<'PY' > /tmp/final-status.json
          import json
          import sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "tintafinal/roblox-deploy",
              "description": sys.argv[2],
          }))
          PY

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/final-status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null

          echo "secret=${SECRET_OUTCOME}"
          echo "structure=${STRUCTURE_OUTCOME}"
          echo "files=${FILES_OUTCOME}"
          echo "security=${SECURITY_OUTCOME}"
          echo "rojo=${ROJO_OUTCOME}"
          echo "build=${BUILD_OUTCOME}"
          echo "publish=${PUBLISH_OUTCOME}"
          echo "verify=${VERIFY_OUTCOME}"
