name: Validar, compilar y publicar TintaFinal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "default.project.json"
      - ".github/workflows/publish-roblox.yml"

concurrency:
  group: tintafinal-production
  cancel-in-progress: true

permissions:
  contents: write

env:
  ROBLOX_UNIVERSE_ID: "8973271699"
  ROBLOX_PLACE_ID: "73618099851560"
  ROJO_VERSION: "7.6.1"

jobs:
  deploy:
    name: Validar, compilar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar proyecto y secreto
        id: check
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ROBLOX_API_KEY:-}"
          test -f default.project.json
          test -d src/server
          test -d src/client
          test -d src/shared
          test -f src/server/Main.server.lua
          test -f src/server/LegacyCleanup.server.lua
          test -f src/client/LegacyGuiCleanup.client.lua
          python3 -m json.tool default.project.json >/dev/null
          echo "Proyecto y secreto disponibles."

      - name: Instalar Rust compatible con Rojo
        id: rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cachear compilación de Rojo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/rojo
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rojo-${{ env.ROJO_VERSION }}

      - name: Instalar Rojo
        id: rojo
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rojo >/dev/null 2>&1; then
            cargo install rojo --version "${ROJO_VERSION}" --locked
          fi
          rojo --version

      - name: Validar árbol Rojo
        id: sourcemap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          rojo sourcemap default.project.json --output build/sourcemap.json
          test -s build/sourcemap.json

      - name: Compilar TintaFinal.rbxlx
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rojo build default.project.json --output build/TintaFinal.rbxlx
          test -s build/TintaFinal.rbxlx
          grep -q "TintaFinal" build/TintaFinal.rbxlx
          ls -lh build/TintaFinal.rbxlx build/sourcemap.json

      - name: Guardar archivo modificable del juego
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: TintaFinal-Roblox-Place
          path: |
            build/TintaFinal.rbxlx
            build/sourcemap.json
          if-no-files-found: error
          retention-days: 30

      - name: Publicar en Roblox
        id: publish
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output build/publish-response.json \
            --write-out '%{http_code}' \
            --request POST \
            "https://apis.roblox.com/universes/v1/${ROBLOX_UNIVERSE_ID}/places/${ROBLOX_PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary @build/TintaFinal.rbxlx)
          echo "${http_code}" > build/publish-http-code.txt
          echo "HTTP ${http_code}"
          cat build/publish-response.json
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            exit 1
          fi

      - name: Verificar respuesta de Roblox
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/publish-response.json")
          response = json.loads(path.read_text(encoding="utf-8"))
          version = response.get("versionNumber")
          try:
              version_number = int(version)
          except (TypeError, ValueError):
              raise SystemExit(f"Roblox no devolvió una versión válida: {response!r}")
          if version_number < 1:
              raise SystemExit(f"Número de versión inválido: {version_number}")
          Path("build/published-version.txt").write_text(str(version_number), encoding="utf-8")
          print(f"Tinta Final publicada correctamente. Versión Roblox: {version_number}")
          PY

      - name: Escribir estado verificable en el repositorio
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          ROJO_OUTCOME: ${{ steps.rojo.outcome }}
          SOURCEMAP_OUTCOME: ${{ steps.sourcemap.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set +e
          mkdir -p automation
          http_code="NO_GENERADO"
          version="NO_GENERADA"
          response="Sin respuesta de Roblox."
          [ -f build/publish-http-code.txt ] && http_code=$(cat build/publish-http-code.txt)
          [ -f build/published-version.txt ] && version=$(cat build/published-version.txt)
          [ -f build/publish-response.json ] && response=$(cat build/publish-response.json | head -c 3000)

          if [ "${VERIFY_OUTCOME}" = "success" ]; then
            final_state="PUBLICADO CORRECTAMENTE"
          else
            final_state="ERROR"
          fi

          cat > automation/PUBLISH_STATUS.md <<EOF
          # Estado de publicación de Tinta Final

          - Estado final: ${final_state}
          - Fecha UTC: $(date -u +'%Y-%m-%d %H:%M:%S')
          - Commit ejecutado: ${GITHUB_SHA}
          - Universe ID: ${ROBLOX_UNIVERSE_ID}
          - Place ID: ${ROBLOX_PLACE_ID}
          - Comprobación: ${CHECK_OUTCOME}
          - Instalación de Rojo: ${ROJO_OUTCOME}
          - Sourcemap: ${SOURCEMAP_OUTCOME}
          - Compilación RBXLX: ${BUILD_OUTCOME}
          - Artifact RBXLX: ${ARTIFACT_OUTCOME}
          - Publicación Roblox: ${PUBLISH_OUTCOME}
          - Verificación de versión: ${VERIFY_OUTCOME}
          - HTTP Roblox: ${http_code}
          - Versión publicada: ${version}

          ## Respuesta de Roblox

          \`\`\`json
          ${response}
          \`\`\`
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/PUBLISH_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado de publicación de Tinta Final"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Guardar respuesta de publicación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Publish-Result
          path: |
            build/publish-response.json
            build/publish-http-code.txt
            build/published-version.txt
          if-no-files-found: warn
          retention-days: 30
