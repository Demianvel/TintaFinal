name: GitHub Actions Probe

# Revisión 2: comprobación efectiva del disparador push.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-probe.yml"
  workflow_dispatch:

concurrency:
  group: tintafinal-actions-probe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar prueba exitosa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          data = {
              "status": "actions-running",
              "sourceCommit": os.environ["GITHUB_SHA"],
              "finishedAtUtc": datetime.now(timezone.utc).isoformat(),
          }
          Path("deploy/actions-probe.json").write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/actions-probe.json
          git commit -m "Confirmar funcionamiento de GitHub Actions"
          git pull --rebase origin main
          git push origin HEAD:main
