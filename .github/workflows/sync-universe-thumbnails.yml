name: Sync Tinta Final universe thumbnails

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/branding/**"
      - "scripts/sync_universe_thumbnails.py"
      - ".github/workflows/sync-universe-thumbnails.yml"

concurrency:
  group: tintafinal-universe-thumbnails
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  thumbnails:
    name: Sincronizar miniaturas reales del universo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests==2.32.4 CairoSVG==2.8.2

      - name: Sincronizar miniaturas con Roblox
        id: thumbnails
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        shell: bash
        run: |
          set +e
          mkdir -p automation
          python scripts/sync_universe_thumbnails.py 2>&1 | tee automation/universe-thumbnails.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guardar resultado
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/UNIVERSE_THUMBNAILS_STATUS.md automation/universe-thumbnails.json automation/universe-thumbnails.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No hay cambios de miniaturas para guardar."
          else
            git commit -m "Conectar miniaturas del universo Tinta Final"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Confirmar miniaturas
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.thumbnails.outputs.exit_code }}" != "0" ]; then
            echo "Falló la sincronización de miniaturas del universo."
            exit 1
          fi
          grep -q 'Estado: CORRECTO' automation/UNIVERSE_THUMBNAILS_STATUS.md
          grep -q 'Miniaturas activas/reutilizadas: 5' automation/UNIVERSE_THUMBNAILS_STATUS.md
          echo "Cinco miniaturas del universo conectadas sin duplicar."
