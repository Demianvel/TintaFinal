name: Configure Tinta Final place

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/configure_place.py"
      - ".github/workflows/configure-place.yml"
      - "src/shared/GameConfig.lua"

concurrency:
  group: tintafinal-place-config
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  configure:
    name: Confirmar servidor de 20 jugadores
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: python -m pip install --disable-pip-version-check requests==2.32.4

      - name: Configurar Place en Roblox
        id: place
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        shell: bash
        run: |
          set +e
          mkdir -p automation
          python scripts/configure_place.py 2>&1 | tee automation/place-config.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guardar verificación
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/PLACE_CONFIG_STATUS.md automation/place-config.log 2>/dev/null || true
          if [ -f automation/place-config.json ]; then
            git add automation/place-config.json
          fi
          if git diff --cached --quiet; then
            echo "Sin cambios de configuración para guardar."
          else
            git commit -m "Verificar servidor Roblox de 20 jugadores"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Exigir confirmación de Roblox
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.place.outputs.exit_code }}" != "0" ]; then
            echo "No se pudo confirmar serverSize=20. La API key necesita universe.place:write."
            exit 1
          fi
          grep -q 'Jugadores máximos por servidor: 20' automation/PLACE_CONFIG_STATUS.md
          echo "Roblox confirmó 20 jugadores máximos por servidor."
