name: Unpack Tinta Final brand assets

on:
  push:
    branches: [main]
    paths:
      - ".asset-upload/**"
      - ".github/workflows/unpack-brand-assets.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir imágenes
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-upload/part-* > /tmp/tinta-assets.tar.gz.b64
          base64 --decode /tmp/tinta-assets.tar.gz.b64 > /tmp/tinta-assets.tar.gz
          tar -xzf /tmp/tinta-assets.tar.gz
          test -f assets/branding/01_pantalla_principal_1280x720.jpg
          test -f assets/branding/02_pantalla_carga_1280x720.jpg
          test -f assets/branding/icono_tinta_final_1024x1024.jpg
          rm -rf .asset-upload
          rm -f .github/workflows/unpack-brand-assets.yml

      - name: Guardar imágenes descomprimidas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Agregar imágenes oficiales descomprimidas de Tinta Final"
          git push
