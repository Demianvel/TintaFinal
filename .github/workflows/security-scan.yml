name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject executable archives and binaries
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \
            \( -iname '*.exe' -o -iname '*.apk' -o -iname '*.bat' -o -iname '*.cmd' \
               -o -iname '*.msi' -o -iname '*.scr' -o -iname '*.dll' -o -iname '*.zip' \
               -o -iname '*.rar' -o -iname '*.7z' \) \
            -not -path './.git/*' -print)

          if [ -n "$forbidden" ]; then
            echo 'Se encontraron archivos binarios o comprimidos no permitidos:'
            echo "$forbidden"
            exit 1
          fi

      - name: Scan suspicious Roblox exploit patterns
        shell: bash
        run: |
          set -euo pipefail
          patterns='loadstring|game[[:space:]]*:[[:space:]]*HttpGet|getgenv|hookmetamethod|getrawmetatable|sethiddenproperty|syn[.]request|request[[:space:]]*\(|firetouchinterest|queue_on_teleport|identifyexecutor|KRNL|Fluxus|Synapse|Kill Aura|Auto Win|Noclip'

          if grep -RInE \
            --exclude-dir=.git \
            --exclude='SECURITY.md' \
            --exclude='security-scan.yml' \
            "$patterns" .; then
            echo 'Se detectaron patrones incompatibles con un proyecto Roblox legítimo.'
            exit 1
          fi

      - name: Check for exposed Roblox API keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          pattern = re.compile(r'''ROBLOX_API_KEY\s*=\s*["'][^$"'][^"']{8,}["']''')
          excluded = {
              Path('.github/workflows/security-scan.yml'),
              Path('SECURITY.md'),
          }

          findings = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in excluded:
                  continue
              try:
                  content = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if pattern.search(content):
                  findings.append(str(path))

          if findings:
              print('Posible API Key escrita directamente en estos archivos:')
              for finding in findings:
                  print(f'- {finding}')
              sys.exit(1)
          PY

      - name: Security scan passed
        run: echo 'No se detectaron ejecutables, secretos ni patrones habituales de exploit.'
