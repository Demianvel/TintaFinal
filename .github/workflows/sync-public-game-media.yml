name: Sync Tinta Final public game media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/branding/main.svg"
      - "scripts/sync_public_game_media.py"
      - ".github/workflows/sync-public-game-media.yml"

concurrency:
  group: tintafinal-public-game-media
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  media:
    name: Reemplazar portada pública vieja
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests==2.32.4 CairoSVG==2.8.2

      - name: Sincronizar portada pública
        id: media
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        shell: bash
        run: |
          set +e
          mkdir -p automation
          python scripts/sync_public_game_media.py 2>&1 | tee automation/public-media-sync.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guardar estado
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/PUBLIC_MEDIA_STATUS.md automation/public-media-sync.json automation/public-media-sync.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No hay cambios de media pública para guardar."
          else
            git commit -m "Actualizar portada pública de Tinta Final"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Confirmar portada
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.media.outputs.exit_code }}" != "0" ]; then
            echo "Falló la sincronización de la portada pública."
            cat automation/PUBLIC_MEDIA_STATUS.md || true
            exit 1
          fi
          grep -q 'Estado: CORRECTO' automation/PUBLIC_MEDIA_STATUS.md
          echo "Portada pública de Tinta Final confirmada."
