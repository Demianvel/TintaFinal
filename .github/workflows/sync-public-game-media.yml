name: Sync Tinta Final public game media
# Retry after Roblox Open Cloud legacy/game-pass/product/messaging scopes were expanded on 2026-08-07.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/branding/**"
      - "scripts/sync_public_game_media.py"
      - ".github/workflows/sync-public-game-media.yml"

concurrency:
  group: tintafinal-public-game-media
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  media:
    name: Sincronizar portada pública de Tinta Final
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar diagnóstico persistente
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation
          cat > automation/PUBLIC_MEDIA_STATUS.md <<'EOF'
          # Portada pública de Tinta Final

          - Estado: INICIANDO
          - Detalle: El workflow comenzó pero todavía no confirmó la sincronización.
          EOF
          : > automation/public-media-sync.log

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests==2.32.4 CairoSVG==2.8.2

      - name: Sincronizar portada pública
        id: media
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        shell: bash
        run: |
          set +e
          python scripts/sync_public_game_media.py 2>&1 | tee automation/public-media-sync.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Clasificar bloqueo legacy como advertencia
        if: always()
        shell: bash
        run: |
          if [ -f automation/PUBLIC_MEDIA_STATUS.md ] && grep -q 'Estado: BLOQUEADO' automation/PUBLIC_MEDIA_STATUS.md; then
            sed -i 's/Estado: BLOQUEADO/Estado: ADVERTENCIA_LEGACY/' automation/PUBLIC_MEDIA_STATUS.md
            cat >> automation/PUBLIC_MEDIA_STATUS.md <<'EOF'
          - Impacto: NO BLOQUEA el juego, la publicación ni las miniaturas modernas del universo.
          - Acción pendiente: revisar legacy-universe:manage solo si Roblox vuelve a responder 401/403.
          EOF
          fi

      - name: Guardar diagnóstico como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinta-final-public-media-diagnostic
          path: |
            automation/PUBLIC_MEDIA_STATUS.md
            automation/public-media-sync.json
            automation/public-media-sync.log
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar estado
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/PUBLIC_MEDIA_STATUS.md automation/public-media-sync.json automation/public-media-sync.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No hay cambios de media pública para guardar."
          else
            git commit -m "Actualizar portada pública de Tinta Final"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Evaluar resultado de portada
        if: always()
        shell: bash
        run: |
          code="${{ steps.media.outputs.exit_code }}"
          if [ "$code" = "0" ]; then
            grep -q 'Estado: CORRECTO' automation/PUBLIC_MEDIA_STATUS.md
            echo "Portada pública de Tinta Final confirmada."
            exit 0
          fi

          if [ "$code" = "2" ]; then
            echo "::warning title=Media pública legacy pendiente::Roblox rechazó una operación legacy. La experiencia y miniaturas modernas continúan operativas."
            cat automation/PUBLIC_MEDIA_STATUS.md || true
            exit 0
          fi

          if [ "$code" = "3" ]; then
            echo "::notice title=Portada en procesamiento::Roblox ya aceptó la nueva portada. Se espera moderación/propagación sin subir copias adicionales."
            cat automation/PUBLIC_MEDIA_STATUS.md || true
            exit 0
          fi

          echo "Falló la sincronización de portada por un error técnico real."
          cat automation/PUBLIC_MEDIA_STATUS.md || true
          exit 1
