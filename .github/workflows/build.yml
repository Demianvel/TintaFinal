name: Build Roblox Place

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Rojo
        run: cargo install rojo --version 7.6.1 --locked

      - name: Build place file
        run: |
          mkdir -p build
          rojo build default.project.json --output build/TintaFinal.rbxlx

      - name: Upload compiled place
        uses: actions/upload-artifact@v4
        with:
          name: TintaFinal-Roblox-Place
          path: build/TintaFinal.rbxlx
          if-no-files-found: error
          retention-days: 14
