name: Build Roblox Place

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-roblox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar TintaFinal.rbxlx
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restaurar caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Instalar Rojo 7.6.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rojo >/dev/null 2>&1; then
            cargo install rojo --version 7.6.1 --locked
          fi
          rojo --version

      - name: Validar archivos esenciales
        shell: bash
        run: |
          set -euo pipefail
          test -f default.project.json
          test -d src/server
          test -d src/client
          test -d src/shared

      - name: Compilar archivo del Place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          rojo build default.project.json --output build/TintaFinal.rbxlx
          test -s build/TintaFinal.rbxlx
          ls -lh build/TintaFinal.rbxlx

      - name: Guardar archivo compilado
        uses: actions/upload-artifact@v4
        with:
          name: TintaFinal-Roblox-Place
          path: build/TintaFinal.rbxlx
          if-no-files-found: error
          retention-days: 14
